name: PR34 planning portal recovery

on:
  push:
    branches:
      - agent/sub15-generation-critical-path

permissions:
  contents: write

jobs:
  repair-planning-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sub15-generation-critical-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Repair local planning source failover and zero-data gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          p = 'src/lib/planning-lpa-fallback.mjs'
          replace_once(p,
          '''    listingUrl: "http://publicaccess.staffsmoorlands.gov.uk/portal/servlets/MajorContentiousDevelopmentservlet",
              parse: parsePublicAccessMajorApplications''',
          '''    listingUrls: Object.freeze([
                "https://publicaccess.staffsmoorlands.gov.uk/portal/servlets/MajorContentiousDevelopmentservlet",
                "http://publicaccess.staffsmoorlands.gov.uk/portal/servlets/MajorContentiousDevelopmentservlet"
              ]),
              parse: parsePublicAccessMajorApplications''')

          replace_once(p,
          '''      const discovery = await discoverPortalApplications(adapter, options, hints);
              attempts.push({
                adapterId: adapter.id,
                jurisdiction: name,
                status: "success",
                candidates: discovery.applications.length,
                cacheHit: discovery.cacheHit
              });''',
          '''      const discovery = await discoverPortalApplications(adapter, options, hints);
              attempts.push({
                adapterId: adapter.id,
                jurisdiction: name,
                status: "success",
                candidates: discovery.applications.length,
                cacheHit: discovery.cacheHit,
                sourceUrl: discovery.sourceUrl,
                transportAttempts: discovery.transportAttempts
              });''')

          replace_once(p,
          '''  const merged = dedupeApplications(applications);
            const addedApplications = Math.max(0, merged.length - (planning?.applications?.length || 0));
            const ranked = rankPlanningApplicationsByOsm(merged, osmDiscovery, options).slice(0, maxApplications);
            return {
              ...planning,
              applications: ranked,
              applicationCount: ranked.length,
              coverageStatus: attempts.length ? "national-plus-local-portal" : (planning?.coverageStatus || "partial-or-unknown"),
              status: addedApplications > 0 ? "acquired-with-local-portal-fallback" : planning?.status,
              osmPlanningDiscovery: compactDiscovery(osmDiscovery),
              localPortalFallback: {
                attempted: attempts.length > 0,
                hints,
                attempts,
                addedApplications
              }
            };''',
          '''  const merged = dedupeApplications(applications);
            const addedApplications = Math.max(0, merged.length - (planning?.applications?.length || 0));
            const ranked = rankPlanningApplicationsByOsm(merged, osmDiscovery, options).slice(0, maxApplications);
            const successfulAttempts = attempts.filter((attempt) => attempt.status === "success");
            const sourceFailure = attempts.length > 0 && successfulAttempts.length === 0;
            return {
              ...planning,
              applications: ranked,
              applicationCount: ranked.length,
              coverageStatus: successfulAttempts.length
                ? "national-plus-local-portal"
                : (planning?.coverageStatus || "partial-or-unknown"),
              status: addedApplications > 0
                ? "acquired-with-local-portal-fallback"
                : sourceFailure && !ranked.length
                  ? "local-portal-source-failed"
                  : planning?.status,
              osmPlanningDiscovery: compactDiscovery(osmDiscovery),
              localPortalFallback: {
                attempted: attempts.length > 0,
                successfulAdapters: successfulAttempts.length,
                sourceFailure,
                hints,
                attempts,
                addedApplications
              }
            };''')

          replace_once(p,
          '''async function discoverPortalApplications(adapter, options, hints) {
            // Keep local-register HTML beside the national planning index cache so the
            // existing Actions cache restores both on normal repeat generations. A
            // refresh/no-cache run still bypasses it through cachedJson exactly as before.
            const cacheDir = path.join(options.cacheDir || ".tpmap-cache", "planning-data-england", "lpa-fallback");
            const cacheKey = `${adapter.id}\\n${adapter.listingUrl}`;
            const { data, cacheHit } = await cachedJson({
              cacheDir,
              key: cacheKey,
              noCache: options.noCache,
              fetcher: async () => ({ html: await fetchText(adapter.listingUrl, options) })
            });
            return {
              applications: adapter.parse(data.html, adapter.listingUrl, hints),
              cacheHit
            };
          }

          async function fetchText(url, options) {
            const implementation = options.fetchPlanningPortalImpl || globalThis.fetch;
            if (typeof implementation !== "function") throw new Error("No fetch implementation is available for local planning portal discovery");
            const response = await implementation(url, {
              redirect: "follow",
              headers: {
                "User-Agent": options.userAgent || "VoxelMapper/0.12",
                Accept: "text/html,application/xhtml+xml;q=0.9,*/*;q=0.5"
              }
            });
            if (!response?.ok) throw new Error(`HTTP ${response?.status ?? "?"} fetching local planning portal`);
            return response.text();
          }''',
          '''async function discoverPortalApplications(adapter, options, hints) {
            // PublicAccess deployments can expose both HTTPS and legacy HTTP transports.
            // Try every declared transport and never turn a transport failure into a
            // successful empty planning result. A fetched page with zero matching rows
            // is still a valid result, but only after all transports have been tried.
            const cacheDir = path.join(options.cacheDir || ".tpmap-cache", "planning-data-england", "lpa-fallback");
            const urls = adapter.listingUrls || [adapter.listingUrl].filter(Boolean);
            const transportAttempts = [];
            let emptySuccess = null;
            for (const listingUrl of urls) {
              try {
                const cacheKey = `${adapter.id}\\n${listingUrl}`;
                const { data, cacheHit } = await cachedJson({
                  cacheDir,
                  key: cacheKey,
                  noCache: options.noCache,
                  fetcher: async () => ({ html: await fetchText(listingUrl, options) })
                });
                const applications = adapter.parse(data.html, listingUrl, hints);
                transportAttempts.push({ url: listingUrl, status: "success", cacheHit, candidates: applications.length });
                const result = { applications, cacheHit, sourceUrl: listingUrl, transportAttempts };
                if (applications.length) return result;
                emptySuccess ||= result;
              } catch (error) {
                transportAttempts.push({ url: listingUrl, status: "failed", message: error?.message || String(error) });
              }
            }
            if (emptySuccess) return { ...emptySuccess, transportAttempts };
            throw new Error(`All local planning portal transports failed: ${transportAttempts.map((entry) => `${entry.url}: ${entry.message || entry.status}`).join("; ")}`);
          }

          async function fetchText(url, options) {
            const implementation = options.fetchPlanningPortalImpl || globalThis.fetch;
            if (typeof implementation !== "function") throw new Error("No fetch implementation is available for local planning portal discovery");
            let lastError = null;
            for (let attempt = 0; attempt < 2; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15_000);
              try {
                const response = await implementation(url, {
                  redirect: "follow",
                  signal: controller.signal,
                  headers: {
                    "User-Agent": options.userAgent || "VoxelMapper/0.12",
                    Accept: "text/html,application/xhtml+xml;q=0.9,*/*;q=0.5"
                  }
                });
                if (!response?.ok) throw new Error(`HTTP ${response?.status ?? "?"} fetching local planning portal`);
                return await response.text();
              } catch (error) {
                lastError = error;
                if (attempt === 0) await new Promise((resolve) => setTimeout(resolve, 500));
              } finally {
                clearTimeout(timer);
              }
            }
            throw lastError || new Error("Local planning portal fetch failed");
          }''')

          # Make early-return diagnostics explicit as well.
          replace_once(p,
          '''      localPortalFallback: { attempted: false, hints, attempts, addedApplications: 0 }''',
          '''      localPortalFallback: { attempted: false, successfulAdapters: 0, sourceFailure: false, hints, attempts, addedApplications: 0 }''')

          plan = 'scripts/planning-document-plan.mjs'
          replace_once(plan,
          '''const planning = sources.planning;
          const queue = buildPlanningDocumentQueue(planning, {''',
          '''const planning = sources.planning;
          if (!(planning.applicationCount > 0) && (
            planning.status === "failed" ||
            planning.status === "local-portal-source-failed" ||
            planning.localPortalFallback?.sourceFailure
          )) {
            throw new Error(`Planning application discovery failed for ${bbox}; refusing to generate an OSM-only world while a required planning source is unavailable`);
          }
          const queue = buildPlanningDocumentQueue(planning, {''')

          test = Path('test/planning-lpa-fallback.test.mjs')
          text = test.read_text()
          text += '''

test("local portal transport falls back from HTTPS failure to legacy HTTP", async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), "voxel-planning-lpa-transport-"));
  try {
    const planning = {
      providerId: "planning-data-england", status: "acquired", applications: [], applicationCount: 0,
      jurisdictions: [{ entity: 999, name: "Staffordshire Moorlands District Council" }]
    };
    const osmData = { elements: [{ type: "way", id: 1, tags: { tourism: "theme_park", name: "Fixture Park" } }] };
    const urls = [];
    const result = await augmentPlanningFromLocalPortals({
      cacheDir: path.join(root, "cache"), noCache: true,
      fetchPlanningPortalImpl: async (url) => {
        urls.push(String(url));
        if (String(url).startsWith("https://")) throw new Error("fixture TLS failure");
        return { ok: true, status: 200, text: async () => portalHtml() };
      }
    }, planning, osmData);
    assert.equal(result.applicationCount, 1);
    assert.equal(urls.length, 3, "HTTPS receives its bounded retry budget before HTTP fallback");
    assert.ok(result.localPortalFallback.attempts[0].sourceUrl.startsWith("http://"));
    assert.equal(result.localPortalFallback.sourceFailure, false);
    assert.equal(result.localPortalFallback.successfulAdapters, 1);
  } finally {
    await rm(root, { recursive: true, force: true });
  }
});

test("failed local portal does not claim national-plus-local coverage", async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), "voxel-planning-lpa-failure-"));
  try {
    const planning = {
      providerId: "planning-data-england", status: "acquired", applications: [], applicationCount: 0,
      coverageStatus: "partial-or-unknown",
      jurisdictions: [{ entity: 999, name: "Staffordshire Moorlands District Council" }]
    };
    const osmData = { elements: [{ type: "way", id: 1, tags: { tourism: "theme_park", name: "Fixture Park" } }] };
    const result = await augmentPlanningFromLocalPortals({
      cacheDir: path.join(root, "cache"), noCache: true,
      fetchPlanningPortalImpl: async () => { throw new Error("fixture outage"); }
    }, planning, osmData);
    assert.equal(result.applicationCount, 0);
    assert.equal(result.coverageStatus, "partial-or-unknown");
    assert.equal(result.status, "local-portal-source-failed");
    assert.equal(result.localPortalFallback.sourceFailure, true);
    assert.equal(result.localPortalFallback.successfulAdapters, 0);
  } finally {
    await rm(root, { recursive: true, force: true });
  }
});
'''
          test.write_text(text)
          PY
      - name: Run planning source regressions
        run: node --test test/planning-lpa-fallback.test.mjs test/automatic-source-acquisition.test.mjs test/planning-acquisition.test.mjs
      - name: Run complete certification
        run: npm test
      - name: Commit source recovery and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Voxel Mapper CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr34-planning-portal-recovery.yml
          git add src/lib/planning-lpa-fallback.mjs scripts/planning-document-plan.mjs test/planning-lpa-fallback.test.mjs
          git commit -m "Fail over local planning portal discovery"
          git push origin HEAD:agent/sub15-generation-critical-path
