name: Build Voxel Mapper Windows app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows-app.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows-app.yml"

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Voxel Mapper runtime dependencies
        run: npm ci

      - name: Assemble self-contained desktop runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD "desktop/runtime"
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          New-Item -ItemType Directory -Path $runtime | Out-Null

          Copy-Item src (Join-Path $runtime "src") -Recurse
          Copy-Item scripts (Join-Path $runtime "scripts") -Recurse
          Copy-Item app (Join-Path $runtime "app") -Recurse
          if (Test-Path assets) { Copy-Item assets (Join-Path $runtime "assets") -Recurse }
          Copy-Item node_modules (Join-Path $runtime "node_modules") -Recurse
          Copy-Item package.json (Join-Path $runtime "package.json")

          # Keep the generator on the exact Node runtime/ABI used by npm ci.
          # Electron is only the native desktop shell and never loads the
          # LevelDB/native generation dependencies in its own Node process.
          $nodeExe = (Get-Command node).Source
          Copy-Item $nodeExe (Join-Path $runtime "node.exe")

          if (-not (Test-Path (Join-Path $runtime "node.exe"))) { throw "Bundled Node runtime missing" }
          if (-not (Test-Path (Join-Path $runtime "app/server.mjs"))) { throw "Stable app backend missing" }
          if (-not (Test-Path (Join-Path $runtime "scripts/generate-bbox-world.mjs"))) { throw "BBox generator missing" }

      - name: Install desktop packager
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer and portable EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop/dist -Filter *.exe
          if ($files.Count -lt 2) {
            Get-ChildItem desktop/dist -Recurse | Format-Table FullName, Length
            throw "Expected both installer and portable Voxel Mapper executables"
          }
          $files | ForEach-Object {
            if ($_.Length -lt 10MB) { throw "Unexpectedly small executable: $($_.Name)" }
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB"
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: voxel-mapper-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Voxel Mapper Windows app"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "The **voxel-mapper-windows** artifact contains:"
          Add-Content $env:GITHUB_STEP_SUMMARY "- an installable Windows `.exe`"
          Add-Content $env:GITHUB_STEP_SUMMARY "- a portable Windows `.exe`"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "Stable mode keeps planning data disabled. 3D buildings remain an in-app toggle."
