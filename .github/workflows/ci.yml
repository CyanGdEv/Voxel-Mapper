name: Voxel Mapper CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run doctor
      - name: Install PDF.js planning extraction runtime
        run: npm install --no-save --package-lock=false --ignore-scripts pdfjs-dist@4.10.38
      - name: Smoke-test real vector PDF extraction
        run: node scripts/planning-pdfjs-smoke.mjs
      - name: Certify real Gray and CMYK planning legend resolution
        run: node scripts/planning-pdf-colour-e2e.mjs
      - name: Certify ICCBased, Separation and DeviceN planning legend resolution
        run: node scripts/planning-pdf-complex-colour-e2e.mjs
