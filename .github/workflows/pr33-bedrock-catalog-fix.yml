name: PR33 Bedrock catalog fix

on:
  push:
    branches:
      - agent/sub15-generation-critical-path

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sub15-generation-critical-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Harden direct-world Bedrock block compatibility
        run: echo '' | base64 -d | python
      - name: Verify the compatibility regression before committing
        run: node --test test/direct-world-palette-compatibility.test.mjs
      - name: Commit production fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Voxel Mapper CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr33-bedrock-catalog-fix.yml
          git add src/lib/mcworld.mjs src/lib/ride-structure-renderer.mjs test/direct-world-palette-compatibility.test.mjs
          git commit -m "Harden Bedrock block palette compatibility"
          git push origin HEAD:agent/sub15-generation-critical-path
