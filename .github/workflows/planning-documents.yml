name: Planning document acquisition

on:
  workflow_call:
    inputs:
      bbox:
        description: "WGS84 bbox: south,west,north,east"
        required: true
        type: string
      max_applications:
        description: "Maximum intersecting planning applications (hard cap 2500)"
        required: false
        default: "2500"
        type: string
      shards:
        description: "Maximum planning pipeline shards (hard cap 256)"
        required: false
        default: "256"
        type: string
      refresh:
        description: "Refresh planning index and document caches"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      bbox:
        description: "WGS84 bbox: south,west,north,east"
        required: true
        type: string
      max_applications:
        description: "Maximum intersecting planning applications (hard cap 2500)"
        required: false
        default: "2500"
        type: string
      shards:
        description: "Maximum planning pipeline shards (hard cap 256)"
        required: false
        default: "256"
        type: string
      refresh:
        description: "Refresh planning index and document caches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      active_shards: ${{ steps.plan.outputs.active_shards }}
      queue_items: ${{ steps.plan.outputs.queue_items }}
      applications: ${{ steps.plan.outputs.applications }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore planning index cache
        uses: actions/cache@v4
        with:
          path: .tpmap-cache/planning-data-england
          key: planning-index-v2-${{ github.run_id }}
          restore-keys: |
            planning-index-v2-
      - id: plan
        name: Discover applications and build document queue
        shell: bash
        run: |
          args=(--bbox "${{ inputs.bbox }}" --max-applications "${{ inputs.max_applications }}" --shards "${{ inputs.shards }}" --out planning-document-queue.json)
          if [[ "${{ inputs.refresh }}" == "true" ]]; then args+=(--refresh); fi
          node scripts/planning-document-plan.mjs "${args[@]}"
      - name: Upload document queue
        uses: actions/upload-artifact@v4
        with:
          name: planning-document-queue
          path: planning-document-queue.json
          retention-days: 7

  georeg_reference:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      reference_status: ${{ steps.reference.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore bbox OSM georegistration cache
        uses: actions/cache@v4
        with:
          path: .tpmap-cache/planning-georeg-osm
          key: planning-georeg-osm-v4-${{ github.run_id }}
          restore-keys: |
            planning-georeg-osm-v4-
            planning-georeg-osm-v3-
            planning-georeg-osm-v2-
      - id: reference
        name: Build current OSM spatial reference while planning documents are acquired
        continue-on-error: true
        shell: bash
        run: |
          args=(--bbox "${{ inputs.bbox }}" --cache .tpmap-cache --out planning-georeg-reference.json)
          if [[ "${{ inputs.refresh }}" == "true" ]]; then args+=(--refresh); fi
          node scripts/planning-osm-reference.mjs "${args[@]}"
      - name: Materialize fail-closed empty reference when OSM reference is unavailable
        if: steps.reference.outcome != 'success'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('planning-georeg-reference.json', JSON.stringify({
            schemaVersion: 1,
            status: 'unavailable',
            bbox: process.env.BBOX,
            provider: null,
            featureCount: 0,
            features: []
          }, null, 2) + '\n');
          NODE
        env:
          BBOX: ${{ inputs.bbox }}
      - name: Upload shared OSM georegistration reference
        uses: actions/upload-artifact@v4
        with:
          name: planning-georeg-reference
          path: planning-georeg-reference.json
          retention-days: 7

  acquire:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.active_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download document queue
        uses: actions/download-artifact@v4
        with:
          name: planning-document-queue
      - name: Restore immutable planning document cache
        uses: actions/cache@v4
        with:
          path: .tpmap-cache/planning-documents
          key: planning-documents-v2-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            planning-documents-v2-shard-${{ matrix.shard }}-
      - name: Discover and acquire shard
        shell: bash
        run: |
          args=(--queue planning-document-queue.json --shard "${{ matrix.shard }}" --cache .tpmap-cache --out "planning-documents-shard-${{ matrix.shard }}.json" --concurrency 12)
          if [[ "${{ inputs.refresh }}" == "true" ]]; then args+=(--refresh); fi
          node scripts/planning-document-worker.mjs "${args[@]}"
      - name: Upload shard manifest
        uses: actions/upload-artifact@v4
        with:
          name: planning-documents-shard-${{ matrix.shard }}
          path: planning-documents-shard-${{ matrix.shard }}.json
          retention-days: 7

  catalog:
    needs: [prepare, acquire]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      active_extraction_shards: ${{ steps.catalog.outputs.active_extraction_shards }}
      extraction_queue_items: ${{ steps.catalog.outputs.extraction_queue_items }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download shard manifests
        uses: actions/download-artifact@v4
        with:
          pattern: planning-documents-shard-*
          path: shard-manifests
          merge-multiple: true
      - id: catalog
        name: Build deduplicated extraction catalog
        run: node scripts/planning-document-catalog.mjs --manifests shard-manifests --out planning-document-catalog.json --extraction-shards 256
      - name: Write acquisition summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('planning-document-catalog.json', 'utf8'));
          const summary = {
            schemaVersion: 2,
            bbox: process.env.BBOX,
            applications: Number(process.env.APPLICATIONS || 0),
            queueItems: Number(process.env.QUEUE_ITEMS || 0),
            shardManifests: catalog.inputShardManifests,
            uniqueDocuments: catalog.uniqueDocuments,
            duplicateReferencesCollapsed: catalog.duplicateReferencesCollapsed,
            extractionQueueItems: catalog.extractionQueueItems,
            activeExtractionShards: catalog.activeExtractionShards,
            extractionShardStrategy: catalog.extractionShardStrategy,
            pendingPortalLinks: catalog.pendingPortalLinks.length,
            revisionChanges: catalog.revisionChanges,
            failures: catalog.failures
          };
          fs.writeFileSync('planning-document-acquisition-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
        env:
          BBOX: ${{ inputs.bbox }}
          APPLICATIONS: ${{ needs.prepare.outputs.applications }}
          QUEUE_ITEMS: ${{ needs.prepare.outputs.queue_items }}
      - name: Upload acquisition catalog and summary
        uses: actions/upload-artifact@v4
        with:
          name: planning-document-acquisition-catalog
          path: |
            planning-document-catalog.json
            planning-document-acquisition-summary.json
          retention-days: 7

  extract-vector:
    needs: [prepare, catalog]
    if: needs.catalog.outputs.extraction_queue_items != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        shard: ${{ fromJSON(needs.catalog.outputs.active_extraction_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install PDF.js extraction runtime
        run: npm install --no-save --package-lock=false --ignore-scripts pdfjs-dist@4.10.38
      - name: Download extraction catalog
        uses: actions/download-artifact@v4
        with:
          name: planning-document-acquisition-catalog
      - name: Restore the matching immutable document shard
        uses: actions/cache@v4
        with:
          path: .tpmap-cache/planning-documents
          key: planning-documents-v2-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            planning-documents-v2-shard-${{ matrix.shard }}-
      - name: Extract vector and text evidence into bounded page streams
        run: node scripts/planning-vector-extract.mjs --catalog planning-document-catalog.json --shard "${{ matrix.shard }}" --cache .tpmap-cache --out "planning-extraction-shard-${{ matrix.shard }}" --concurrency 2
      - name: Upload extraction shard bundle
        uses: actions/upload-artifact@v4
        with:
          name: planning-extraction-shard-${{ matrix.shard }}
          path: planning-extraction-shard-${{ matrix.shard }}
          retention-days: 7

  merge-extraction:
    needs: [catalog, extract-vector]
    if: always() && needs.catalog.outputs.extraction_queue_items != '0' && needs.extract-vector.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      active_georeg_shards: ${{ steps.georeg_plan.outputs.active_georeg_shards }}
      georeg_page_count: ${{ steps.georeg_plan.outputs.georeg_page_count }}
      georeg_shard_count: ${{ steps.georeg_plan.outputs.georeg_shard_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download vector extraction bundles
        uses: actions/download-artifact@v4
        with:
          pattern: planning-extraction-shard-*
          path: extraction-manifests
          merge-multiple: false
      - name: Merge normalized planning evidence without global geometry materialization
        run: node scripts/planning-vector-merge.mjs --manifests extraction-manifests --out planning-vector-evidence --raster-fallback-out planning-raster-fallback-queue.json
      - id: georeg_plan
        name: Balance planning pages across parallel georegistration runners
        run: node scripts/planning-georeg-plan.mjs --evidence planning-vector-evidence --shards 256 --out planning-georeg-shard-plan.json
      - name: Upload normalized planning extraction evidence and georegistration plan
        uses: actions/upload-artifact@v4
        with:
          name: planning-vector-extraction-evidence
          path: |
            planning-vector-evidence
            planning-raster-fallback-queue.json
            planning-georeg-shard-plan.json
          retention-days: 7

  georegister:
    needs: [merge-extraction, georeg_reference]
    if: always() && needs.merge-extraction.result == 'success' && needs.georeg_reference.outputs.reference_status == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        shard: ${{ fromJSON(needs.merge-extraction.outputs.active_georeg_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download normalized planning evidence bundle and shard plan
        uses: actions/download-artifact@v4
        with:
          name: planning-vector-extraction-evidence
          path: planning-extraction-download
      - name: Download shared OSM georegistration reference
        uses: actions/download-artifact@v4
        with:
          name: planning-georeg-reference
      - name: Materialize this balanced planning page shard
        run: >-
          node scripts/planning-georeg-shard.mjs
          --evidence planning-extraction-download/planning-vector-evidence
          --plan planning-extraction-download/planning-georeg-shard-plan.json
          --shard "${{ matrix.shard }}"
          --out "planning-georeg-input-shard-${{ matrix.shard }}"
      - name: Register only this shard against the shared current spatial reference
        run: >-
          node scripts/planning-georegister.mjs
          --evidence "planning-georeg-input-shard-${{ matrix.shard }}"
          --reference planning-georeg-reference.json
          --out "planning-georegistration-shard-${{ matrix.shard }}.json"
          --registered-out "planning-registered-evidence-shard-${{ matrix.shard }}"
      - name: Upload registered planning page shard
        uses: actions/upload-artifact@v4
        with:
          name: planning-georegistration-shard-${{ matrix.shard }}
          path: |
            planning-georegistration-shard-${{ matrix.shard }}.json
            planning-registered-evidence-shard-${{ matrix.shard }}
          retention-days: 7

  finalize-current-state:
    needs: [georegister, georeg_reference, catalog]
    if: always() && needs.georegister.result == 'success' && needs.georeg_reference.outputs.reference_status == 'success' && needs.catalog.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download every registered planning page shard
        uses: actions/download-artifact@v4
        with:
          pattern: planning-georegistration-shard-*
          path: planning-georegistration-shards
          merge-multiple: false
      - name: Download shared OSM georegistration reference
        uses: actions/download-artifact@v4
        with:
          name: planning-georeg-reference
      - name: Download planning document catalog
        uses: actions/download-artifact@v4
        with:
          name: planning-document-acquisition-catalog
      - name: Download immutable planning application snapshot
        uses: actions/download-artifact@v4
        with:
          name: planning-document-queue
      - name: Merge parallel page registrations in-process for authority resolution
        run: >-
          node scripts/planning-georeg-merge.mjs
          --shards planning-georegistration-shards
          --reference planning-georeg-reference.json
          --out planning-georegistration.json
          --registered-out planning-registered-evidence
      - name: Resolve revisions, current state and post-decision implementation evidence without an intermediate artifact round trip
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          node scripts/planning-resolve-revisions.mjs
          --registered planning-registered-evidence
          --reference planning-georeg-reference.json
          --catalog planning-document-catalog.json
          --queue planning-document-queue.json
          --out planning-revision-resolution.json
          --resolved-out planning-current-state-evidence.json
          --authority-out planning-current-authority-pointer.json
      - name: Materialize only the strict authority subset for world fusion
        run: node scripts/planning-authority-compat.mjs --manifest planning-current-authority-pointer.json --out planning-current-authority-evidence.json
      - name: Upload current-state authority and compact georegistration audit
        uses: actions/upload-artifact@v4
        with:
          name: planning-current-state-evidence
          path: |
            planning-georegistration.json
            planning-georeg-reference.json
            planning-registered-evidence/manifest.json
            planning-revision-resolution.json
            planning-current-state-evidence.json
            planning-current-state-evidence-bundle
            planning-current-authority-pointer.json
            planning-current-authority-pointer-bundle
            planning-current-authority-evidence.json
          retention-days: 7

  finalize-current-state-degraded:
    needs: [merge-extraction, georeg_reference, catalog]
    if: always() && needs.merge-extraction.result == 'success' && needs.georeg_reference.outputs.reference_status != 'success' && needs.catalog.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download fail-closed OSM georegistration reference
        uses: actions/download-artifact@v4
        with:
          name: planning-georeg-reference
      - name: Download planning document catalog
        uses: actions/download-artifact@v4
        with:
          name: planning-document-acquisition-catalog
      - name: Download immutable planning application snapshot
        uses: actions/download-artifact@v4
        with:
          name: planning-document-queue
      - name: Record degraded registration when the reference is unavailable
        shell: bash
        run: |
          mkdir -p planning-registered-evidence
          node - <<'NODE'
          const fs = require('fs');
          const report = {
            schemaVersion: 3,
            status: 'unregistered',
            mode: 'reference-unavailable',
            reason: 'bbox-osm-reference-unavailable',
            worldGeometryReady: false,
            worldGeometryAuthority: false,
            temporalResolutionRequired: true,
            registrations: [],
            unregisteredPages: [],
            note: 'Planning extraction remains valid document-space evidence; generation should fall back to lower-authority spatial evidence rather than fail.'
          };
          const manifest = {
            schemaVersion: 1,
            format: 'voxel-planning-registered-bundle-v1',
            stage: 'registered',
            coordinateSpace: 'local-world-metres',
            georegistrationStatus: 'unregistered',
            worldGeometryReady: false,
            worldGeometryAuthority: false,
            temporalResolutionRequired: true,
            pageCount: 0,
            registeredPageCount: 0,
            templateOnlyPageCount: 0,
            unregisteredPageCount: 0,
            geometryCandidateCount: 0,
            verticalObservationCount: 0,
            materialObservationCount: 0,
            rideStructureTemplateCount: 0,
            pages: [],
            unregisteredPages: []
          };
          fs.writeFileSync('planning-georegistration.json', JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync('planning-registered-evidence/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Resolve the empty spatial authority fail-closed while preserving application/revision diagnostics
        run: >-
          node scripts/planning-resolve-revisions.mjs
          --registered planning-registered-evidence
          --reference planning-georeg-reference.json
          --catalog planning-document-catalog.json
          --queue planning-document-queue.json
          --out planning-revision-resolution.json
          --resolved-out planning-current-state-evidence.json
          --authority-out planning-current-authority-pointer.json
      - name: Materialize fail-closed authority compatibility output
        run: node scripts/planning-authority-compat.mjs --manifest planning-current-authority-pointer.json --out planning-current-authority-evidence.json
      - name: Upload degraded current-state authority and audit
        uses: actions/upload-artifact@v4
        with:
          name: planning-current-state-evidence
          path: |
            planning-georegistration.json
            planning-georeg-reference.json
            planning-registered-evidence/manifest.json
            planning-revision-resolution.json
            planning-current-state-evidence.json
            planning-current-state-evidence-bundle
            planning-current-authority-pointer.json
            planning-current-authority-pointer-bundle
            planning-current-authority-evidence.json
          retention-days: 7