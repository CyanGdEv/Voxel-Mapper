name: Branch planning page debug

on:
  push:
    branches: [agent/bedrock-terrain-materialization-fix]
    paths:
      - ".github/workflows/branch-planning-page-debug.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch representative SW8 application pages and attachments
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p debug-pages debug-attachments
          for item in "2016-0315:104356" "2017-0111:111996"; do
            name="${item%%:*}"
            pkid="${item##*:}"
            url="http://publicaccess.staffsmoorlands.gov.uk/portal/servlets/ApplicationSearchServlet?PKID=${pkid}"
            curl -L --fail --retry 2 --connect-timeout 20 --max-time 60 \
              -A 'VoxelMapper/0.12 planning compatibility diagnostic' \
              "$url" -o "debug-pages/${name}.html"
            echo "===== ${name}: attachment/form/url patterns ====="
            grep -Eino '.{0,160}(attachment|document|image|servlet|onclick|href=|action=|window\.open|PKID|ID=).{0,220}' "debug-pages/${name}.html" | tail -n 250 || true
          done

          # Representative planning drawing image IDs from the two pages.
          for image_id in 160144 160145 163929 163930 176955 176956; do
            url="http://publicaccess.staffsmoorlands.gov.uk/portal/servlets/AttachmentShowServlet?ImageName=${image_id}"
            echo "===== attachment ${image_id} ====="
            curl -L --fail --retry 2 --connect-timeout 20 --max-time 60 \
              -A 'VoxelMapper/0.12 planning compatibility diagnostic' \
              -D "debug-attachments/${image_id}.headers" \
              "$url" -o "debug-attachments/${image_id}.bin"
            file "debug-attachments/${image_id}.bin" || true
            sed -n '1,80p' "debug-attachments/${image_id}.headers" || true
            ls -lh "debug-attachments/${image_id}.bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: planning-page-debug-html
          path: |
            debug-pages/*.html
            debug-attachments/*
          retention-days: 1
