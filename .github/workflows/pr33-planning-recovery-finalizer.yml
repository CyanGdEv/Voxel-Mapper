name: PR33 planning recovery finalizer

on:
  push:
    branches:
      - agent/sub15-generation-critical-path

permissions:
  contents: write

jobs:
  finalize-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sub15-generation-critical-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply planning recovery
        run: python scripts/pr33-recovery-patch.py
      - name: Preserve real Landscape Site Plan classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/planning-documents.mjs')
          text = p.read_text()
          old = 'landscape plan|landscaping plan|landscape layout|planting plan|tree plan|soft landscape'
          new = 'landscape site plan|landscape plan|landscaping plan|landscape layout|planting plan|tree plan|soft landscape'
          if text.count(old) != 1:
              raise SystemExit(f'expected one landscape rule target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Run full certification
        run: npm test
      - name: Commit final recovery and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "Voxel Mapper CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr33-planning-tree-recovery.yml .github/workflows/pr33-planning-recovery-finalizer.yml scripts/pr33-recovery-patch.py
          git add src/lib test assets/tree-templates/31060.schem.gz
          git commit -m "Restore planning geometry and apply supplied tree schematic"
          git push origin HEAD:agent/sub15-generation-critical-path
