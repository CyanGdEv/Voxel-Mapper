name: Materialize and certify v0.12

on:
  push:
    branches:
      - agent/planning-authority-architecture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-certify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/planning-authority-architecture
          fetch-depth: 1

      - name: Recover verified architecture delta from current branch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/architecture.patch.xz.b64
          for part in 00 01 02 03; do
            file=".bootstrap/current-architecture.patch.xz.b64.part${part}"
            test -s "${file}"
            cat "${file}" >> /tmp/architecture.patch.xz.b64
          done
          base64 --decode /tmp/architecture.patch.xz.b64 > /tmp/architecture.patch.xz
          echo "94da0e8d6ae09038cd6db09d1d1583183f3301ccf34a828797d453e1d38eda3c  /tmp/architecture.patch.xz" | sha256sum --check
          xz -t /tmp/architecture.patch.xz
          xz -dc /tmp/architecture.patch.xz > /tmp/architecture.patch

      - name: Materialize v0.12 source
        shell: bash
        run: |
          set -euo pipefail
          patch --dry-run -p1 --batch --forward --fuzz=3 < /tmp/architecture.patch
          patch -p1 --batch --forward --fuzz=3 < /tmp/architecture.patch
          rm -f .github/workflows/apply-planning-authority.yml
          rm -f .bootstrap/current-architecture.patch.xz.b64.part00 \
                .bootstrap/current-architecture.patch.xz.b64.part01 \
                .bootstrap/current-architecture.patch.xz.b64.part02 \
                .bootstrap/current-architecture.patch.xz.b64.part03
          rmdir .bootstrap 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run complete test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v012-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: error
          retention-days: 3

      - name: Run repository doctor
        run: npm run doctor

      - name: Verify materialized tree is clean of bootstrap machinery
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/apply-planning-authority.yml
          test ! -e .bootstrap/current-architecture.patch.xz.b64.part00
          test ! -e .bootstrap/current-architecture.patch.xz.b64.part01
          test ! -e .bootstrap/current-architecture.patch.xz.b64.part02
          test ! -e .bootstrap/current-architecture.patch.xz.b64.part03
          test -f .github/workflows/ci.yml
          test -f .github/workflows/build-park.yml
          test -f src/lib/planning.mjs
          test -f src/lib/material-palettes.mjs
          test -f test/planning-fusion.test.mjs
          test -f test/lidar-roof-authority.test.mjs

      - name: Commit certified v0.12 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f test-output.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Voxel Mapper v0.12 planning-authority architecture"
          git push origin HEAD:agent/planning-authority-architecture
