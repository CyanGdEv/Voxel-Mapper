name: Apply planning-authority architecture

on:
  push:
    branches:
      - agent/planning-authority-architecture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout expanded baseline
        uses: actions/checkout@v4
        with:
          ref: agent/planning-authority-architecture
          fetch-depth: 1

      - name: Recover verified architecture delta from repository API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BOOTSTRAP_COMMIT=b0630dedf9537f4d1de63178111593b2ed86eeb0
          : > /tmp/architecture.patch.xz.b64
          for part in 00 01 02; do
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.bootstrap/architecture.patch.xz.b64.part${part}?ref=${BOOTSTRAP_COMMIT}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}" \
              | python -c 'import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)["content"]).decode("utf-8"), end="")' \
              >> /tmp/architecture.patch.xz.b64
          done
          base64 --decode /tmp/architecture.patch.xz.b64 > /tmp/architecture.patch.xz
          echo "94dabda5deed892bf85aa56c921df422bb49b63875a64af00488e63bba3950e  /tmp/architecture.patch.xz" | sha256sum --check
          xz -t /tmp/architecture.patch.xz
          xz -dc /tmp/architecture.patch.xz > /tmp/architecture.patch

      - name: Apply architecture delta
        shell: bash
        run: |
          set -euo pipefail
          patch --dry-run -p1 --batch --forward --fuzz=3 < /tmp/architecture.patch
          patch -p1 --batch --forward --fuzz=3 < /tmp/architecture.patch
          rm -f .github/workflows/apply-planning-authority.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Run repository doctor
        run: npm run doctor

      - name: Commit validated v0.12 architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite Voxel Mapper around planning-authority fusion"
          git push origin HEAD:agent/planning-authority-architecture
