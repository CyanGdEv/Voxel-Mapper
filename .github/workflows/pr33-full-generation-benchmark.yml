name: PR34 full generation benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr34-full-generation-benchmark
  cancel-in-progress: true

jobs:
  full-generation:
    if: github.head_ref == 'agent/sub15-generation-critical-path'
    uses: ./.github/workflows/generate-world.yml
    with:
      bbox: "52.9820,-1.9000,52.9945,-1.8665"

  benchmark-complete:
    needs: full-generation
    if: always() && github.head_ref == 'agent/sub15-generation-critical-path'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful complete generation
        shell: bash
        run: |
          echo "Full generation result: ${{ needs.full-generation.result }}"
          [[ "${{ needs.full-generation.result }}" == "success" ]]
      - name: Download generated world
        uses: actions/download-artifact@v4
        with:
          name: voxel-mapper-mcworld
          path: full-generation-world
      - name: Download generation evidence
        uses: actions/download-artifact@v4
        with:
          name: voxel-mapper-generation-evidence
          path: full-generation-evidence
      - name: Require validated world and meaningful planning reconstruction
        shell: bash
        run: |
          shopt -s nullglob
          worlds=(full-generation-world/*.mcworld)
          [[ ${#worlds[@]} -eq 1 ]]
          test -s "${worlds[0]}"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const resultPath = path.join('full-generation-evidence', 'world-download', 'bbox-generation-result.json');
          const buildPath = path.join('full-generation-evidence', 'preparation', 'out', 'bbox-world', 'build-result.json');
          const fusionPath = path.join('full-generation-evidence', 'preparation', 'out', 'bbox-world', 'planning-authority-fusion.json');
          const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const build = JSON.parse(fs.readFileSync(buildPath, 'utf8'));
          const fusion = JSON.parse(fs.readFileSync(fusionPath, 'utf8'));
          const stats = build.stats || {};
          const counts = fusion.changeSet?.counts || {};
          const topologyOrSurfaceChanges = Number(counts.add || 0) + Number(counts.replace || 0) + Number(counts.delete || 0) + Number(counts.paint || 0);
          const planning3d = Number(stats.planningObject3dRendered || 0) + Number(stats.rideStructure3dRendered || 0);
          const meaningfulPlanningWorldChanges = topologyOrSurfaceChanges + planning3d;
          console.log(JSON.stringify({
            bbox: result.bbox,
            worldChunks: result.worldChunks,
            worldValidation: result.worldValidation,
            planningAuthorityAppliedAttributes: result.planningAuthorityAppliedAttributes,
            planningChangeSet: counts,
            planningObject3dRendered: stats.planningObject3dRendered || 0,
            rideStructure3dRendered: stats.rideStructure3dRendered || 0,
            meaningfulPlanningWorldChanges,
            shardCount: result.parallelWorldBuild?.shards,
            grade: result.grade,
            confidence: result.confidence
          }, null, 2));
          if (result.worldValidation !== 'passed') throw new Error(`World validation failed: ${result.worldValidation}`);
          if (Number(result.worldChunks || 0) < 1000) throw new Error(`Unexpectedly small world: ${result.worldChunks || 0} chunks`);
          if (Number(result.planningAuthorityAppliedAttributes || 0) <= 0) throw new Error('No verified planning authority attributes reached the generated world');
          if (meaningfulPlanningWorldChanges <= 0) throw new Error('Verified planning evidence produced no visible topology, surface, or 3D reconstruction changes');
          NODE
